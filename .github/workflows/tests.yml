# Bij elke wijziging (push en pull request) alle tests draaien en de site bouwen.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Controleer dat de site en de app echt bouwen (zelfde opdracht als Cloudflare).
      - run: npm run build
      - run: test -f dist/index.html && test -f dist/app/index.html && test -f dist/sw.js && test -f dist/beheer/index.html
