# Tijdelijk: visuele vergelijking oud (Tailwind-script) tegen nieuw (gebouwd CSS). Wordt daarna verwijderd.
name: Tailwind vergelijken
on:
  push:
    branches: [tailwind-bouw]
permissions:
  contents: write
jobs:
  vergelijk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: |
          python .github/check/vergelijk.py
        shell: bash
        working-directory: .
      - name: Schermafbeeldingen naar aparte branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tailwind-vergelijk
          git rm -rq --cached .
          git add -f vergelijk/*.png
          git commit -qm "Schermafbeeldingen Tailwind-vergelijking"
          git push -f origin tailwind-vergelijk
