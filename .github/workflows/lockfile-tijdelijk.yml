# Tijdelijk: werkt package-lock.json bij voor Tailwind 3.4.17 (wordt daarna weer verwijderd).
name: Lockfile bijwerken
on:
  push:
    branches: [tailwind-bouw]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: ls dist/assets && grep -l "bg-kooq-sage" dist/assets/*.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "package-lock bijgewerkt voor Tailwind 3.4.17"
          git push
